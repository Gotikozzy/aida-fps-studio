name: Build unsigned Windows candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.7'
      - name: Install reference Python dependencies
        run: |
          python -m pip install --require-hashes -r requirements-windows.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-deps --no-build-isolation -e .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
      - name: Fetch and verify pinned inputs
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./scripts/build_candidate.ps1 -Stage prepare
      - name: Compile the reference FFmpeg runtime
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./scripts/build_candidate.ps1 -Stage media
      - name: Compile the optional NVIDIA bridge
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./scripts/build_candidate.ps1 -Stage native
      - name: Test with the rebuilt media runtime
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./scripts/build_candidate.ps1 -Stage test
      - name: Freeze application and package source
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./scripts/build_candidate.ps1 -Stage freeze
      - name: Stage corresponding sources and review native composition
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./scripts/build_candidate.ps1 -Stage legal
      - name: Build unsigned NSIS installer
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./scripts/build_candidate.ps1 -Stage installer
      - name: Run frozen application self-test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./scripts/build_candidate.ps1 -Stage smoke
      - name: Prepare final candidate checksums
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./scripts/build_candidate.ps1 -Stage finalize
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-windows-candidate
          path: dist/installer/public/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: build-evidence
          path: |
            build/lgpl-native/configure.json
            build/lgpl-native/site/runtime-manifest.json
            build/self-test/
            build/candidate-test-results.xml
            installer/distribution-review.json
          if-no-files-found: ignore
