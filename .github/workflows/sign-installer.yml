name: Submit reviewed installer to SignPath (no publication)
on:
  workflow_dispatch:
    inputs:
      version:
        description: Reviewed installer version (X.Y.Z)
        required: true
        type: string
      unsigned_artifact_id:
        description: GitHub artifact ID from a reviewed GitHub-hosted candidate build
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  sign:
    if: vars.SIGNPATH_ENABLED == 'true' && github.ref == 'refs/heads/main'
    environment: signing-production
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      # Configure origin constraints in SignPath; never accept arbitrary uploads.
      # This policy signs only the outer installer. Complete inner/uninstaller stages
      # before describing a release as fully signed. See CODE_SIGNING.md.
      - name: Submit artifact and wait for manual SignPath approval
        uses: SignPath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ inputs.unsigned_artifact_id }}
          parameters: |
            version: ${{ toJSON(inputs.version) }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 6000
          output-artifact-directory: signed
      - name: Require valid final installer signatures
        run: |
          $Installers = @(Get-ChildItem signed -Recurse -Filter '*-setup.exe')
          if ($Installers.Count -ne 1) { throw 'Expected one signed installer' }
          foreach ($Installer in $Installers) {
            $Signature = Get-AuthenticodeSignature -LiteralPath $Installer.FullName
            if ($Signature.Status -ne 'Valid') { throw 'Invalid installer signature' }
            # Publisher identity/chain restrictions must also be configured in SignPath.
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-installer-review-only
          path: signed/
          if-no-files-found: error
