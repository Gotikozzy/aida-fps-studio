name: Build unsigned Windows candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.7'
      - name: Install reference Python dependencies
        run: |
          python -m pip install --require-hashes -r requirements-windows.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Build from pinned sources and run candidate checks
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./scripts/build_candidate.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-windows-candidate
          path: dist/installer/public/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: build-evidence
          path: |
            build/lgpl-native/configure.json
            build/lgpl-native/site/runtime-manifest.json
            build/self-test/
            installer/distribution-review.json
          if-no-files-found: ignore
