name: Isolated original-installer pilot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    if: github.repository == 'Gotikozzy/aida-fps-studio' && github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        legacy: ['0.8.12', '0.8.14']
    permissions:
      # Reading the private legacy QA draft requires an identity with push access.
      # This job never writes/releases assets; signing credentials are not present.
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.7'
      - name: Install verified test tools
        run: |
          python -m pip install --require-hashes -r requirements-windows.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-deps --no-build-isolation -e .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify_source_integrity.py
      - name: Fetch original installers with fixed hashes and origin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/prepare_installer_pilot.py build/pilot-inputs --legacy-version ${{ matrix.legacy }}
      - name: Exercise fresh install, upgrade, projects and uninstall
        env:
          AIDA_INSTALLER_PILOT: '1'
          QT_QPA_PLATFORM: windows
        run: >-
          python scripts/run_installer_pilot.py
          --legacy build/pilot-inputs/AIDA-FPS-Studio-${{ matrix.legacy }}-windows-x64-setup.exe
          --legacy-version ${{ matrix.legacy }}
          --candidate build/pilot-inputs/AIDA-FPS-Studio-0.8.15-windows-x64-setup.exe
          --output "${{ runner.temp }}/aida-installer-pilot"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: original-installer-pilot-evidence-${{ matrix.legacy }}
          path: ${{ runner.temp }}/aida-installer-pilot/
          if-no-files-found: ignore
          retention-days: 30
