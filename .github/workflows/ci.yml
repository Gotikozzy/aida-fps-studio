name: Source and regression checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.7'
      - name: Install reference Python dependencies
        run: |
          python -m pip install --require-hashes -r requirements-windows.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Check public source and measurement baseline
        run: |
          python scripts/check_repository.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify_source_integrity.py
      - name: CPU regression suite (development wheel runtime)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q --junitxml=build/test-results.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: cpu-test-results
          path: build/test-results.xml
          if-no-files-found: ignore
